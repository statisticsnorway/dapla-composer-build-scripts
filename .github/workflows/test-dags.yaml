name: Test DAGs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: statisticsnorway/dapla-composer-build-scripts
          path: dapla-composer-build-scripts
          sparse-checkout: test-dags

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r dapla-composer-build-scripts/test-dags/requirements-test.txt

      - name: Test DAGs
        run: |
          set -euo pipefail
          for dags_directory in automation/statomaten/*/dags; do
            [ -d "$dags_directory" ] || continue
            echo "Testing $dags_directory"
            python dapla-composer-build-scripts/test-dags/validate_dags.py --dags_directory="$dags_directory"
            if [ -d "$dags_directory/test" ]; then
              (cd "$dags_directory" && python -m pytest -s test/)
            fi
          done
