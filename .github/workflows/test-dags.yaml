name: Test DAGs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: statisticsnorway/dapla-composer-build-scripts
          path: dapla-composer-build-scripts
          sparse-checkout: test-dags

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r dapla-composer-build-scripts/test-dags/requirements-test.txt

      - name: Test DAGs
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          for dags_directory in automation/statomaten/*/dags; do
            [ -d "$dags_directory" ] || continue
            if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "$dags_directory"; then
              echo "Skipping unchanged $dags_directory"
              continue
            fi
            echo "Testing $dags_directory"
            python dapla-composer-build-scripts/test-dags/validate_dags.py --dags_directory="$dags_directory"
            if [ -d "$dags_directory/test" ]; then
              (cd "$dags_directory" && python -m pytest -s test/)
            fi
          done
