name: Check DAGs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  statomaten_inputs:
    runs-on: ubuntu-latest
    outputs:
      should_build_image: ${{ steps.inputs.outputs.should_build_image }}
      should_test_dags: ${{ steps.inputs.outputs.should_test_dags }}
      folders_with_changed_dags: ${{ steps.inputs.outputs.folders_with_changed_dags }}
      pyver: ${{ steps.inputs.outputs.pyver }}
      builder: ${{ steps.inputs.outputs.builder }}
      dependencies: ${{ steps.inputs.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Resolve workflow inputs
        id: inputs
        run: uv run https://raw.githubusercontent.com/statisticsnorway/dapla-composer-build-scripts/main/tools/statomaten_inputs.py

  check-dags:
    if: ${{ github.event_name == 'pull_request' && needs.statomaten_inputs.outputs.should_test_dags == 'true' }}
    needs: [statomaten_inputs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Clone check scripts
        run: git clone -b main --depth 1 https://github.com/statisticsnorway/dapla-composer-build-scripts

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install check dependencies
        run: python -m pip install -r dapla-composer-build-scripts/check-dags/requirements.txt

      - name: Check DAGs
        run: |
          set -euo pipefail
          for dags_directory in ${{ needs.statomaten_inputs.outputs.folders_with_changed_dags }}; do
            echo "Checking $dags_directory"
            python dapla-composer-build-scripts/check-dags/validate_dags.py --dags_directory="$dags_directory"
            if [ -d "$dags_directory/test" ]; then
              (cd "$dags_directory" && python -m pytest -s test/)
            fi
          done
