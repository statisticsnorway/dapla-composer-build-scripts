name: Build and Push Python Docker Image

on:
  workflow_call:
    inputs:
      pyproject_dir:
        required: true
        type: string
      image_name:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AR_PROJECT_ID: artifact-registry-5n
  AR_LOCATION: europe-north1
  GCP_WIF_PROVIDER: projects/848539402404/locations/global/workloadIdentityPools/gh-actions/providers/gh-actions

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      pyver:            ${{ steps.vars.outputs.pyver }}
      builder:          ${{ steps.vars.outputs.builder }}
      dependencies:     ${{ steps.vars.outputs.dependencies }}
      ar_repository:    ${{ steps.vars.outputs.ar_repository }}
      service_account:  ${{ steps.vars.outputs.service_account }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve from toml + team-info
        id: vars
        run: |
          PYPROJECT="${{ inputs.pyproject_dir }}/pyproject.toml"

          # --- TEAM (like kildomaten reads team_uniform_name) ---
          TEAM_NAME=$(yq '.metadata.team_name' metadata/team-info.yaml)
          echo "ar_repository=${TEAM_NAME}-docker" >> "$GITHUB_OUTPUT"
          echo "service_account=gh-actions-${TEAM_NAME}@${AR_PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"

          # --- VERSION from toml ---
          REQ=$(yq -p toml '.project.requires-python' "$PYPROJECT")
          PYVER=$(echo "$REQ" | grep -oE '3\.[0-9]+' | head -1)
          if [ -z "$PYVER" ]; then
            echo "::error::Could not parse Python version from requires-python='${REQ}'"
            exit 1
          fi
          echo "pyver=${PYVER}" >> "$GITHUB_OUTPUT"

          # --- BUILDER mapping ---
          case "$PYVER" in
            3.11|3.12|3.13) BUILDER="gcr.io/buildpacks/builder:google-22" ;;
            3.14)           BUILDER="gcr.io/buildpacks/builder:latest" ;;
            *) echo "::error::Python ${PYVER} not supported"; exit 1 ;;
          esac
          echo "builder=${BUILDER}" >> "$GITHUB_OUTPUT"

          # --- PACKAGES / dependencies from toml (as JSON, multiline-safe) ---
          DEPS=$(yq -p toml -o=json '.project.dependencies' "$PYPROJECT")
          echo "dependencies=${DEPS}" >> "$GITHUB_OUTPUT"
          echo "Resolved deps: ${DEPS}"

  build_and_push:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ needs.resolve.outputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker ${{ env.AR_LOCATION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5

      - name: Build and push
        env:
          PYVER:   ${{ needs.resolve.outputs.pyver }}
          BUILDER: ${{ needs.resolve.outputs.builder }}
          AR_REPO: ${{ needs.resolve.outputs.ar_repository }}
        run: |
          IMAGE="${AR_LOCATION}-docker.pkg.dev/${AR_PROJECT_ID}/${AR_REPO}/${{ inputs.image_name }}"
          pack build "${IMAGE}:latest" \
            --tag "${IMAGE}:${PYVER}" \
            --tag "${IMAGE}:${PYVER}-${GITHUB_SHA}" \
            --builder "${BUILDER}" \
            --env "GOOGLE_RUNTIME_VERSION=${PYVER}" \
            --path "${{ inputs.pyproject_dir }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${PYVER}"
          docker push "${IMAGE}:${PYVER}-${GITHUB_SHA}"